<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共识报告 · {{QUESTION}}</title>
<!--
  consensus skill 报告渲染模板（短幻灯片 deck，show-me 风格）
  渲染：lib/render-report.mjs 注入 report.json 替换 const D 占位符
  每页一个叙事单元：封面 / 结论与证据 / 辩论过程 / 分歧与保留 / 修复候选 / 成本
  空内容页自动跳过；过程页三席泳道图 + 辩论经过时间线并列（matrix 缺失仅时间线）
  导航：←/→ 键盘 + 底部进度点（可点击）；深链接 ?slide=N（1-based）
-->
<style>
  :root {
    --ink: #1a1d23; --ink-2: #4a5060; --ink-3: #8a90a0;
    --line: #e3e6ec; --bg: #fbfbfd; --card: #ffffff;
    --accent: #2f5fd7; --accent-soft: #eef2fc;
    --ok: #1a7f4b; --ok-soft: #e9f6ef;
    --warn: #9a6b00; --warn-soft: #fdf3dd;
    --bad: #b3392e; --bad-soft: #fdeeec;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.75 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink); background: var(--bg); }
  code, .file { font-family: var(--mono); font-size: 12.5px; background: var(--accent-soft);
    color: var(--accent); padding: 1px 5px; border-radius: 3px; word-break: break-all; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 10px;
    border-radius: 999px; vertical-align: 2px; white-space: nowrap; }
  .b-strong  { background: var(--ok-soft); color: var(--ok); }
  .b-reserve { background: var(--warn-soft); color: var(--warn); }
  .b-major   { background: var(--accent-soft); color: var(--accent); }
  .b-stuck   { background: var(--bad-soft); color: var(--bad); }

  /* deck 布局：每页一屏，页内独立滚动 */
  .deck { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .slide { width: 100%; max-width: 880px; max-height: calc(100dvh - 110px);
    overflow-y: auto; padding: 28px 30px 44px; animation: fadeUp .18s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) {
    .deck { align-items: flex-start; }
    .slide { max-height: calc(100dvh - 92px); padding: 20px 18px 36px; }
  }
  /* 页眉：章节名 + 问题标题 + 页码（封面页除外） */
  .slide-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 22px; }
  .slide-head b { font: 600 13px var(--mono); color: var(--ink); letter-spacing: 1.5px; white-space: nowrap; }
  .slide-head .q { flex: 1; font-size: 12px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .slide-head .pg { font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .layer-tag { font: 11px var(--mono); color: var(--ink-3); letter-spacing: 2px; }
  .sec-head { margin-top: 28px; }

  /* 封面 */
  .cover-kicker { font: 12px var(--mono); color: var(--ink-3); letter-spacing: 3px; margin-bottom: 14px; }
  h1 { font-size: 26px; line-height: 1.5; margin-bottom: 14px; }
  .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 14px; font-family: var(--mono); line-height: 2; }

  /* 结论卡 / 通用卡片 */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 26px; box-shadow: 0 1px 3px rgba(20,24,34,.04); }
  .root-text { font-size: 18px; font-weight: 600; line-height: 1.7; margin: 8px 0 6px; }
  .votes { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

  /* 根因分层细目：breakdown 结构化列表（缺口分层 / 前置阻塞等各一层） */
  .rc-breakdown { list-style: none; margin: 18px 0 0; counter-reset: rc; }
  .rc-breakdown li { counter-increment: rc; position: relative; padding: 12px 0 12px 38px; border-top: 1px dashed var(--line); }
  .rc-breakdown li::before { content: counter(rc); position: absolute; left: 0; top: 14px;
    width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
    font: 600 12px/24px var(--mono); text-align: center; }
  .rc-breakdown li b { display: block; font-size: 14px; line-height: 1.6; margin-bottom: 3px; }
  .rc-breakdown .rc-detail { font-size: 13px; color: var(--ink-2); line-height: 1.85; }
  /* 兜底：无 breakdown 的长文本按句拆行（第一句为总判断，其余按段） */
  .rc-paras { margin-top: 4px; }
  .rc-paras p { font-size: 13.5px; color: var(--ink-2); line-height: 1.9;
    padding: 9px 0 9px 16px; border-top: 1px dashed var(--line); }

  /* 轨迹：泳道图 */
  .lane { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .lane-seat { display: flex; gap: 10px; }
  .lane-who { flex: 0 0 132px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); padding-top: 8px; }
  .lane-who small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
  .lane-steps { flex: 1; display: flex; gap: 8px; }
  .lane-step { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.6; min-width: 0; }
  .step-tag { display: block; font: 10.5px var(--mono); color: var(--ink-3); letter-spacing: 1px; margin-bottom: 3px; }
  .lane-step.vote-agree { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .lane-step.vote-obj   { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .lane-step.vote-res   { border-color: var(--warn); color: var(--warn); font-weight: 600; }
  @media (max-width: 640px) {
    .lane-seat { flex-direction: column; gap: 4px; }
    .lane-who { padding-top: 0; }
    .lane-steps { flex-wrap: wrap; }
    .lane-step { flex: 1 1 45%; }
  }

  /* 轨迹：降级时间线 */
  .timeline { list-style: none; padding-left: 0; margin-top: 14px; }
  .timeline li { padding-left: 96px; position: relative; margin-bottom: 12px; font-size: 14px; }
  .timeline .t { position: absolute; left: 0; top: 0; font: 11.5px var(--mono); color: var(--ink-3); }

  /* 证据索引 */
  .ev-list { list-style: none; margin-top: 14px; }
  .ev-list li { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px; }
  .ev-list .ok-check { color: var(--ok); font-weight: 600; }
  .ev-list .no-check { color: var(--ink-3); font-size: 12px; }

  /* 分歧 */
  .div-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 22px; margin-bottom: 12px; }
  .div-card h3 { font-size: 15px; margin-bottom: 10px; }
  .div-sides { display: flex; gap: 10px; }
  .div-side { flex: 1; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; }
  .div-side .who { font-family: var(--mono); font-size: 11.5px; color: var(--accent);
    font-weight: 600; display: block; margin-bottom: 3px; }
  .div-res { font: 12px var(--mono); color: var(--ink-3); margin-top: 10px; }
  @media (max-width: 640px) { .div-sides { flex-direction: column; } }

  /* 修复候选 */
  .fix-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .fix-card { flex: 1 1 260px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; }
  .fix-card h3 { font-size: 14.5px; margin-bottom: 6px; }
  .fix-card p { font-size: 13px; color: var(--ink-2); }
  .fix-card .fix-note { color: var(--bad); margin-top: 6px; }
  .fix-card .votes { margin-top: 8px; }

  /* 保留意见 */
  blockquote { border-left: 3px solid var(--line); padding: 8px 16px; margin: 0 0 6px;
    color: var(--ink-2); font-size: 14px; background: var(--card); border-radius: 0 8px 8px 0; }
  .q-who { font-size: 11px; color: var(--ink-3); font-family: var(--mono); display: block; margin-bottom: 3px; }
  .res-evidence { font: 12px var(--mono); color: var(--ink-3); margin: 0 0 16px 19px; }

  /* 成本 */
  .cost-line { font-family: var(--mono); font-size: 13px; color: var(--ink-2); line-height: 2.1; }
  .cost-compare { margin-top: 14px; background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; padding: 10px 16px; font-size: 13px; line-height: 1.8; }

  /* 底部导航 */
  #nav { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; z-index: 99;
    background: #1a1d23; color: #fff; border-radius: 999px; padding: 7px 16px;
    box-shadow: 0 8px 28px rgba(20,24,34,.38); user-select: none; }
  #nav button { background: none; border: 0; color: #cdd3e0; font-size: 16px; cursor: pointer;
    padding: 2px 8px; border-radius: 999px; line-height: 1; }
  #nav button:hover { background: #2c3242; color: #fff; }
  #dots { display: flex; gap: 7px; align-items: center; }
  #dots .dot { width: 7px; height: 7px; border-radius: 50%; background: #4a5060;
    cursor: pointer; transition: background .15s; }
  #dots .dot.on { background: #fff; }
  #navlabel { font-size: 12.5px; color: #cdd3e0; white-space: nowrap; }
  #navlabel small { color: #8a90a0; margin-left: 6px; }
  @media (max-width: 640px) { #navlabel { display: none; } }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div id="nav">
  <button id="prev" title="上一页（←）">←</button>
  <div id="dots"></div>
  <button id="next" title="下一页（→）">→</button>
  <div id="navlabel"></div>
</div>
<script>
const D = __REPORT__;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = (s) => {
  const cls = { "强共识":"b-strong", "共识+保留意见":"b-reserve", "多数共识 2:1":"b-major", "未收敛":"b-stuck" }[s] || "b-stuck";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
};
const invLine = () => (D.investigators||[]).map(i => esc(i.id) + (i.model ? `(${esc(i.model)})` : "")).join(" / ");
const metaLine = () => `${esc(D.date)} · ${esc(D.workspace)} · ${esc(D.rounds)}${D.mode ? " · " + esc(D.mode) : ""}`;

/* ---------- 各页渲染：每页一个叙事单元，结构化讲清全过程 ---------- */

function renderCover() {
  return `
  <p class="cover-kicker">共识诊断报告</p>
  <h1>${esc(D.question)}</h1>
  <p>${badge(D.rootCause.status)}</p>
  <p class="meta">${metaLine()}<br>${invLine()}</p>`;
}

/* 结论与证据：总判断先行，分层细目（breakdown）结构化展开；证据索引紧随 */
function renderConclusion() {
  const rc = D.rootCause || {};
  const ev = (rc.evidence||[]).map(e => `<span class="file">${esc(e)}</span>`).join("");
  const idx = (D.evidenceIndex||[]).map(e => `
    <li><span class="file">${esc(e.loc)}</span> ${esc(e.desc)}
      ${e.verified ? `<span class="ok-check">✓ 已复核</span>` : `<span class="no-check">未复核</span>`}</li>`).join("");
  /* 分层细目：优先 breakdown；无 breakdown 的多句长文本按句兜底拆行（首句为总判断） */
  let headline = rc.text, body = "";
  if ((rc.breakdown||[]).length) {
    body = `<ol class="rc-breakdown">${rc.breakdown.map(x => `
      <li>${x.label ? `<b>${esc(x.label)}</b>` : ""}<div class="rc-detail">${esc(x.text)}</div></li>`).join("")}</ol>`;
  } else {
    const paras = String(rc.text || "").split(/(?<=[。；])/).map(s => s.trim()).filter(Boolean);
    if (paras.length > 1) {
      headline = paras[0];
      body = `<div class="rc-paras">${paras.slice(1).map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
    }
  }
  return `
  <div class="card">
    <div class="layer-tag">根因共识</div>
    <div class="root-text">${esc(headline)} ${badge(rc.status)}</div>
    <p class="votes">${esc(rc.votes)}</p>
    ${body}
    ${ev ? `<div class="chips">${ev}</div>` : ""}
  </div>
  ${idx ? `<div class="layer-tag sec-head">证据索引</div><ul class="ev-list">${idx}</ul>` : ""}`;
}

/* 辩论过程：泳道图看结构 + 时间线读叙事（两者并列，缺一不硬凑） */
const STEPS = [["r1","R1 盲辩"],["r2","R2 交叉批评"],["r3","R3 收敛"],["vote","表决"]];
function renderProcess() {
  const m = D.matrix || {}, invs = D.investigators || [];
  const hasLane = invs.some(i => m[i.id]);
  const traj = (D.trajectory||[]).map(t => `<li><span class="t">${esc(t.round)}</span>${esc(t.key)}（${esc(t.turns)}）</li>`).join("");
  let lane = "";
  if (hasLane) {
    const cols = STEPS.filter(([k]) => k === "vote" || invs.some(i => m[i.id] && m[i.id][k]));
    const seats = invs.map(inv => {
      const cells = m[inv.id] || {};
      const steps = cols.map(([k, label]) => {
        const v = cells[k];
        if (k === "vote") {
          const cls = /反对/.test(v) ? "vote-obj" : /保留/.test(v) ? "vote-res" : "vote-agree";
          return `<div class="lane-step ${cls}"><span class="step-tag">${label}</span>${v ? esc(v) : "—"}</div>`;
        }
        return `<div class="lane-step"><span class="step-tag">${label}</span>${v ? esc(v) : "—"}</div>`;
      }).join("");
      return `<div class="lane-seat">
        <div class="lane-who">${esc(inv.id)}<small>${esc(inv.host||"")} ${esc(inv.model||"")}</small></div>
        <div class="lane-steps">${steps}</div></div>`;
    }).join("");
    lane = `<div class="layer-tag">三席泳道</div><div class="lane">${seats}</div>`;
  }
  const tl = traj ? `<div class="layer-tag ${hasLane ? "sec-head" : ""}">辩论经过</div><ul class="timeline">${traj}</ul>` : "";
  return lane + tl;
}

/* 分歧与保留：不同声音集中讲清（已解决的分歧 + 未消除的保留意见） */
function renderDissent() {
  const div = (D.divergences||[]).map(x => `
  <div class="div-card">
    <h3>${esc(x.point)}</h3>
    <div class="div-sides">
      <div class="div-side"><span class="who">${esc(x.a)}</span>${esc(x.aView)}</div>
      <div class="div-side"><span class="who">${esc(x.b)}</span>${esc(x.bView)}</div>
    </div>
    <p class="div-res">${esc(x.round)} · ${esc(x.resolved)}</p>
  </div>`).join("");
  const res = (D.reservations||[]).map(x => `
    <blockquote><span class="q-who">${esc(x.who)} 原话（逐字引用）</span>“${esc(x.quote)}”</blockquote>
    <p class="res-evidence">${esc(x.evidence)}</p>`).join("");
  return `
  ${div ? `<div class="layer-tag">分歧记录</div>${div}` : ""}
  ${res ? `<div class="layer-tag ${div ? "sec-head" : ""}">保留意见（带证据者才收录）</div>${res}` : ""}`;
}

/* 修复候选（无反对票层，多候选并列） */
function renderFixes() {
  return `<div class="layer-tag">修复候选（无反对票层）</div><div class="fix-row">${(D.fixes||[]).map(x => `
    <div class="fix-card">
      <h3>${esc(x.title)} ${badge(x.status)}</h3>
      <p>${esc(x.desc)}</p>
      ${x.note ? `<p class="fix-note">${esc(x.note)}</p>` : ""}
      <p class="votes">${esc(x.votes)}</p>
    </div>`).join("")}</div>`;
}

function renderCost() {
  const row = k => (D.cost && D.cost[k]) ? `<p class="cost-line">${esc(D.cost[k])}</p>` : "";
  const cmp = D.cost && D.cost.compare ? `<p class="cost-compare">${esc(D.cost.compare)}</p>` : "";
  return `<div class="card"><div class="layer-tag">成本披露</div>${row("calls")}${row("tokens")}${row("wall")}${cmp}</div>`;
}

/* ---------- 组装：按叙事顺序，空内容页自动跳过 ---------- */

const hasLane = () => !!(D.matrix && (D.investigators||[]).some(i => D.matrix[i.id]));
const slides = [
  { key: "cover", name: "封面", html: renderCover() },
  { key: "conclusion", name: "结论与证据", html: renderConclusion() },
];
if (hasLane() || (D.trajectory||[]).length)
  slides.push({ key: "process", name: "辩论过程", html: renderProcess() });
if ((D.divergences||[]).length || (D.reservations||[]).length)
  slides.push({ key: "dissent", name: "分歧与保留", html: renderDissent() });
if ((D.fixes||[]).length)
  slides.push({ key: "fixes", name: "修复候选", html: renderFixes() });
slides.push({ key: "cost", name: "成本", html: renderCost() });

/* ---------- 导航：键盘 ←/→ + 进度点 + 深链接 ?slide=N ---------- */

const deck = document.getElementById("deck"),
      dots = document.getElementById("dots"),
      navlabel = document.getElementById("navlabel");
function currentIdx() {
  const n = parseInt(new URLSearchParams(location.search).get("slide") || "1", 10);
  return Math.min(Math.max((isNaN(n) ? 1 : n) - 1, 0), slides.length - 1);
}
let idx = currentIdx();
function show(i) {
  idx = ((i % slides.length) + slides.length) % slides.length;
  const url = new URL(location); url.searchParams.set("slide", String(idx + 1));
  history.replaceState(null, "", url);
  document.title = `共识报告 · ${D.question}`;
  const s = slides[idx];
  /* 页眉：章节名 + 问题标题 + 页码（封面页自含大标题，不加页眉） */
  const head = s.key === "cover" ? "" :
    `<header class="slide-head"><b>${esc(s.name)}</b><span class="q">${esc(D.question)}</span><span class="pg">${idx+1}/${slides.length}</span></header>`;
  deck.innerHTML = `<div class="slide">${head}${s.html}</div>`;
  dots.innerHTML = slides.map((x, j) => `<span class="dot ${j===idx?"on":""}" data-i="${j}" title="${esc(x.name)}"></span>`).join("");
  navlabel.innerHTML = `${esc(s.name)}<small>${idx+1}/${slides.length}</small>`;
}
const go = d => show(idx + d);
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick  = () => go(1);
dots.onclick = e => { const i = e.target.dataset && e.target.dataset.i; if (i != null) show(+i); };
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
show(idx);
</script>
</body>
</html>
